project_id = "zap-sucatas"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://zap-sucatas.vercel.app"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/login",
  "http://localhost:5173/cadastro",
  "http://localhost:5173/recuperar-senha",
  "https://zap-sucatas.vercel.app",
  "https://zap-sucatas.vercel.app/login",
  "https://zap-sucatas.vercel.app/cadastro",
  "https://zap-sucatas.vercel.app/recuperar-senha",
  "https://zapsucatas.com.br",
  "https://zapsucatas.com.br/login",
  "https://zapsucatas.com.br/cadastro",
  "https://zapsucatas.com.br/recuperar-senha"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.email.smtp]
enabled = true
host = "smtp.hostinger.com"
port = 465
user = "info@zapsucatas.com.br"
pass = "env(SMTP_PASSWORD)"
admin_email = "info@zapsucatas.com.br"
sender_name = "Zap Sucatas"

[auth.email.template.invite]
subject = "Você foi convidado para o Zap Sucatas"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirme seu cadastro no Zap Sucatas"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha no Zap Sucatas"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao Zap Sucatas"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme a troca de e-mail da sua conta"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Código de confirmação de identidade"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
subject = "Sua senha foi alterada"
content_path = "./supabase/templates/notification_password_changed.txt"

[auth.email.notification.email_changed]
subject = "Seu e-mail foi alterado"
content_path = "./supabase/templates/notification_email_changed.txt"

[auth.email.notification.phone_changed]
subject = "Seu telefone foi alterado"
content_path = "./supabase/templates/notification_phone_changed.txt"

[auth.email.notification.identity_linked]
subject = "Nova identidade vinculada"
content_path = "./supabase/templates/notification_identity_linked.txt"

[auth.email.notification.identity_unlinked]
subject = "Identidade removida"
content_path = "./supabase/templates/notification_identity_unlinked.txt"

[auth.email.notification.mfa_factor_enrolled]
subject = "MFA ativado"
content_path = "./supabase/templates/notification_mfa_enrolled.txt"

[auth.email.notification.mfa_factor_unenrolled]
subject = "MFA removido"
content_path = "./supabase/templates/notification_mfa_unenrolled.txt"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

