project_id = "zap-sucatas"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://zap-sucatas.vercel.app"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/login",
  "http://localhost:5173/cadastro",
  "http://localhost:5173/recuperar-senha",
  "https://zap-sucatas.vercel.app",
  "https://zap-sucatas.vercel.app/login",
  "https://zap-sucatas.vercel.app/cadastro",
  "https://zap-sucatas.vercel.app/recuperar-senha",
  "https://zapsucatas.com.br",
  "https://zapsucatas.com.br/login",
  "https://zapsucatas.com.br/cadastro",
  "https://zapsucatas.com.br/recuperar-senha"
]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.submit-listing-for-review]
verify_jwt = false

[functions.approve-listing]
verify_jwt = false

[functions.reject-listing]
verify_jwt = false

[functions.answer-listing-question]
verify_jwt = false

[functions.sync-lme-prices]
verify_jwt = false

[functions.notify-listing-status]
verify_jwt = true

[functions.manage-user-account]
verify_jwt = false

[functions.manage-listing-lifecycle]
verify_jwt = false

[functions.reorder-listing-images]
verify_jwt = false

[functions.manage-listing-category]
verify_jwt = false

[functions.manage-listing-material]
verify_jwt = false

[functions.moderate-listing-question]
verify_jwt = false
