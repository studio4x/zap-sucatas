project_id = "zap-sucatas"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/login",
  "http://localhost:5173/cadastro",
  "http://localhost:5173/recuperar-senha"
]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.submit-listing-for-review]
verify_jwt = true

[functions.approve-listing]
verify_jwt = true

[functions.reject-listing]
verify_jwt = true

[functions.answer-listing-question]
verify_jwt = true

[functions.sync-lme-prices]
verify_jwt = true

[functions.notify-listing-status]
verify_jwt = true
